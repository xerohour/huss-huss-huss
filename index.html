.d{font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700;color:#fff;line-height:1;-webkit-text-stroke:1.3cqw #1b2140;paint-order:stroke fill;text-shadow:0 .9cqw 0 #1b2140}
.hud{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}

.place{position:absolute;left:4.5cqw;top:max(4cqw,env(safe-area-inset-top));font-size:18cqw}
.fire{position:absolute;left:5cqw;top:calc(max(4cqw,env(safe-area-inset-top)) + 20cqw);font-size:6.5cqw;color:#ffd43b;-webkit-text-stroke:1cqw #1b2140}
.clock{position:absolute;right:4.5cqw;top:max(5cqw,env(safe-area-inset-top));font-size:6.4cqw;padding:1.8cqw 3.6cqw 2cqw;border-radius:99px;background:#1b2140d9;-webkit-text-stroke:0;text-shadow:none;font-variant-numeric:tabular-nums;min-width:22cqw;text-align:center}
.bar{position:absolute;left:38cqw;right:6cqw;top:calc(max(5cqw,env(safe-area-inset-top)) + 16cqw);height:1.8cqw;border-radius:9px;background:#1b214099}
.bar:after{content:"";position:absolute;right:-1cqw;top:-1.6cqw;width:1.4cqw;height:5cqw;border-radius:2px;background:#fff;box-shadow:0 0 0 .5cqw #1b2140}
.dot{position:absolute;top:50%;width:2.2cqw;height:2.2cqw;margin:-1.1cqw 0 0 -1.1cqw;border-radius:50%}
.dot.me{width:4.6cqw;height:4.6cqw;margin:-2.3cqw 0 0 -2.3cqw;border:.9cqw solid #17c7bf;box-shadow:0 0 0 .5cqw #1b2140;z-index:2}
.big{position:absolute;left:3cqw;right:3cqw;top:33%;text-align:center;font-size:17cqw}
.big.low{top:60%}
.big.go{font-size:30cqw;color:#8be04e}
.big small{display:block;font:400 4.6cqw system-ui,sans-serif;-webkit-text-stroke:0;text-shadow:0 .4cqw 1.6cqw #000c;margin:3cqw auto 0;max-width:84cqw;line-height:1.2}
.cap{position:absolute;left:5cqw;right:5cqw;top:58%;text-align:center;font-size:7.4cqw;line-height:1.12;-webkit-text-stroke:1cqw #1b2140;opacity:0}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
@keyframes capin{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.1)}18%{transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.pads{position:absolute;left:0;right:0;bottom:max(6cqw,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 7cqw;transition:opacity .15s}
.pad{width:21cqw;height:21cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10cqw;background:#1b214059;border:.9cqw solid #ffffff59;opacity:.6;transition:transform .07s,opacity .07s;-webkit-text-stroke:0;text-shadow:none}
.pad.next{background:linear-gradient(#ffe066,#ffb01f);border-color:#1b2140;opacity:1;transform:scale(1.1);box-shadow:inset 0 -1.3cqw 0 #e08a00,inset 0 1cqw 0 #fff1a8,0 1.1cqw 0 #1b2140;-webkit-text-stroke:1.1cqw #1b2140;text-shadow:0 .7cqw 0 #1b2140}
.hud.qon .pads,.hud.qon .cap,.hud.qon .coachtip,.hud.qon .hand,.hud.qon .fire{opacity:0!important}
.coachtip{position:absolute;left:3cqw;right:3cqw;bottom:calc(max(6cqw,env(safe-area-inset-bottom)) + 44cqw);text-align:center;font-size:9cqw;color:#ffd43b;opacity:0;transition:opacity .15s}
.hand{position:absolute;left:10.5cqw;bottom:calc(max(6cqw,env(safe-area-inset-bottom)) + 23cqw);font-size:14cqw;line-height:1;opacity:0;filter:drop-shadow(0 .8cqw 0 #1b2140)}

.hud.coach.cr .hand{left:auto;right:10.5cqw}
.hud.coach .pad.next{animation:padp .25s ease-in-out infinite alternate}
@keyframes tipwob{0%{transform:scale(1) rotate(-2deg)}100%{transform:scale(1.08) rotate(2deg)}}
@keyframes poke{0%{transform:translateY(-5cqw)}100%{transform:translateY(1cqw)}}
@keyframes padp{0%{transform:scale(1.1)}100%{transform:scale(1.42);box-shadow:inset 0 -1.3cqw 0 #e08a00,inset 0 1cqw 0 #fff1a8,0 1.1cqw 0 #1b2140,0 0 9cqw 2cqw #ffe066}}
.hud.qon.lr .pads{opacity:1!important;bottom:54%}
.card{position:absolute;left:0;right:0;bottom:0;padding:6cqw 6cqw max(2.5cqw,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(#0b163000,#0b1630b3 40%,#0b1630e6)}

.logo-rainbow{position:relative;z-index:1;display:inline-block;background:linear-gradient(90deg,#ff0000,#ff7f00,#ffee00,#00c853,#0091ff,#7c4dff,#ff0000);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rainbowShift 4s linear infinite;-webkit-text-stroke:1cqw #1b2140;paint-order:stroke fill;text-shadow:none;filter:none}

.logo-olympics{color:#fff;letter-spacing:-0.3cqw;white-space:nowrap;-webkit-text-stroke:2.2cqw #1b2140;paint-order:stroke fill;text-shadow:0 1.8cqw 0 #1b2140}
.btn{pointer-events:auto;margin-top:3cqw;font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700;font-size:9cqw;line-height:1;color:#fff;-webkit-text-stroke:1.1cqw #1c5c16;paint-order:stroke fill;padding:3.4cqw 10cqw 4.8cqw;min-width:56cqw;white-space:nowrap;border-radius:6cqw;border:1cqw solid #1b2140;background:linear-gradient(#93e653,#3fb52e);box-shadow:inset 0 -1.7cqw 0 #2a8f1f,inset 0 1.2cqw 0 #c6f79b,0 1.5cqw 0 #1b2140}
.btn:active{transform:translateY(1cqw);box-shadow:inset 0 -1.7cqw 0 #2a8f1f,inset 0 1.2cqw 0 #c6f79b,0 .5cqw 0 #1b2140}
.tip{font-size:4.4cqw;margin-top:3cqw;text-shadow:0 .3cqw 1.5cqw #000a}
.best{font-size:3.6cqw;opacity:.75;margin-top:0.8cqw}
.rtag{font-size:6.4cqw;color:#ffd43b;-webkit-text-stroke:1cqw #1b2140}
.rplace{font-size:38cqw;margin-top:1cqw;-webkit-text-stroke:2.4cqw #1b2140;text-shadow:0 2cqw 0 #1b2140}
